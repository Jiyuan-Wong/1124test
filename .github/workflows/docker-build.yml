name: Build Docker Image

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-r-image:1.0 .

      - name: Check R version
        run: docker run --rm my-r-image:1.0 R --version
